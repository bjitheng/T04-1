<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 2rem;
			background: #f4f7fb;
			font-family: Arial, sans-serif;
		}

		svg {
			display: block;
			width: min(100%, 800px);
			height: auto;
			border: 3px solid #394867;
			border-radius: 8px;
			background: #b9e6ff;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
		}

		#scene-annotated #annotations text,
		#scene-annotated #annotations line {
			pointer-events: none;
		}

		/* Step 3 styling stays local to the adjusted SVG. */
		#scene-adjusted .adjusted-fence {
			stroke-dasharray: 12 8;
			stroke-width: 6;
		}

		#scene-adjusted .adjusted-outline {
			stroke-width: 4;
		}

		#scene-adjusted .smoke {
			fill: #d8e1e6;
			opacity: 0.75;
		}
	</style>
</head>
<body>
	<figure id="scene-original">
		<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
			<title id="scene-title">A house and garden scene</title>
			<desc id="scene-desc">A sunny garden with a cloud, tree, fenced house, curved garden path, and caption.</desc>

			<!-- Sky and grass -->
			<rect x="0" y="0" width="800" height="350" fill="#b9e6ff" />
			<rect x="0" y="350" width="800" height="150" fill="#84c878" />

			<!-- Sun and cloud -->
			<circle cx="690" cy="85" r="48" fill="#ffd166" stroke="#e09f1f" stroke-width="4" />
			<ellipse cx="170" cy="105" rx="72" ry="28" fill="#ffffff" />
			<circle cx="125" cy="104" r="28" fill="#ffffff" />
			<circle cx="188" cy="91" r="35" fill="#ffffff" />

			<!-- Tree -->
			<rect x="92" y="245" width="34" height="125" fill="#8b5a2b" />
			<circle cx="110" cy="205" r="64" fill="#3f9f57" />
			<circle cx="65" cy="236" r="45" fill="#48ad5d" />
			<circle cx="155" cy="237" r="48" fill="#48ad5d" />

			<!-- House body, roof, and chimney -->
			<rect x="270" y="245" width="300" height="180" fill="#f2b36d" stroke="#754c29" stroke-width="5" />
			<polygon points="245,250 420,105 595,250" fill="#c95b48" stroke="#754c29" stroke-width="5" />
			<rect x="485" y="145" width="42" height="82" fill="#8e5142" stroke="#754c29" stroke-width="5" />

			<!-- Door and windows -->
			<rect x="382" y="320" width="76" height="105" fill="#73503c" stroke="#4d3528" stroke-width="4" />
			<circle cx="443" cy="374" r="5" fill="#ffd166" />
			<rect x="300" y="285" width="68" height="58" fill="#9ddcf2" stroke="#4d6975" stroke-width="5" />
			<line x1="334" y1="285" x2="334" y2="343" stroke="#4d6975" stroke-width="4" />
			<line x1="300" y1="314" x2="368" y2="314" stroke="#4d6975" stroke-width="4" />
			<rect x="474" y="285" width="68" height="58" fill="#9ddcf2" stroke="#4d6975" stroke-width="5" />
			<line x1="508" y1="285" x2="508" y2="343" stroke="#4d6975" stroke-width="4" />
			<line x1="474" y1="314" x2="542" y2="314" stroke="#4d6975" stroke-width="4" />

			<!-- Fence -->
			<polyline points="15,390 15,335 45,335 45,390 75,390 75,335 105,335 105,390 135,390 135,335 165,335 165,390 195,390" fill="none" stroke="#8b5a2b" stroke-width="8" />
			<line x1="0" y1="360" x2="210" y2="360" stroke="#8b5a2b" stroke-width="8" />

			<!-- Curved garden path -->
			<path d="M 420 425 C 420 450, 350 462, 300 500 L 530 500 C 500 462, 455 450, 458 425 Z" fill="#d8b27c" stroke="#aa8252" stroke-width="3" />

			<text x="400" y="475" text-anchor="middle" font-size="22" fill="#254b2c">Welcome to our garden</text>
		</svg>
		<figcaption>Original scene</figcaption>
	</figure>

	<figure id="scene-annotated-figure">
		<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="annotated-title annotated-desc">
			<title id="annotated-title">Annotated house and garden scene</title>
			<desc id="annotated-desc">The original house and garden scene with labels identifying SVG shape attributes.</desc>

			<!-- Sky and grass -->
			<rect x="0" y="0" width="800" height="350" fill="#b9e6ff" />
			<rect x="0" y="350" width="800" height="150" fill="#84c878" />

			<!-- Sun and cloud -->
			<circle cx="690" cy="85" r="48" fill="#ffd166" stroke="#e09f1f" stroke-width="4" />
			<ellipse cx="170" cy="105" rx="72" ry="28" fill="#ffffff" />
			<circle cx="125" cy="104" r="28" fill="#ffffff" />
			<circle cx="188" cy="91" r="35" fill="#ffffff" />

			<!-- Tree -->
			<rect x="92" y="245" width="34" height="125" fill="#8b5a2b" />
			<circle cx="110" cy="205" r="64" fill="#3f9f57" />
			<circle cx="65" cy="236" r="45" fill="#48ad5d" />
			<circle cx="155" cy="237" r="48" fill="#48ad5d" />

			<!-- House body, roof, and chimney -->
			<rect x="270" y="245" width="300" height="180" fill="#f2b36d" stroke="#754c29" stroke-width="5" />
			<polygon points="245,250 420,105 595,250" fill="#c95b48" stroke="#754c29" stroke-width="5" />
			<rect x="485" y="145" width="42" height="82" fill="#8e5142" stroke="#754c29" stroke-width="5" />

			<!-- Door and windows -->
			<rect x="382" y="320" width="76" height="105" fill="#73503c" stroke="#4d3528" stroke-width="4" />
			<circle cx="443" cy="374" r="5" fill="#ffd166" />
			<rect x="300" y="285" width="68" height="58" fill="#9ddcf2" stroke="#4d6975" stroke-width="5" />
			<line x1="334" y1="285" x2="334" y2="343" stroke="#4d6975" stroke-width="4" />
			<line x1="300" y1="314" x2="368" y2="314" stroke="#4d6975" stroke-width="4" />
			<rect x="474" y="285" width="68" height="58" fill="#9ddcf2" stroke="#4d6975" stroke-width="5" />
			<line x1="508" y1="285" x2="508" y2="343" stroke="#4d6975" stroke-width="4" />
			<line x1="474" y1="314" x2="542" y2="314" stroke="#4d6975" stroke-width="4" />

			<!-- Fence -->
			<polyline points="15,390 15,335 45,335 45,390 75,390 75,335 105,335 105,390 135,390 135,335 165,335 165,390 195,390" fill="none" stroke="#8b5a2b" stroke-width="8" />
			<line x1="0" y1="360" x2="210" y2="360" stroke="#8b5a2b" stroke-width="8" />

			<!-- Curved garden path -->
			<path d="M 420 425 C 420 450, 350 462, 300 500 L 530 500 C 500 462, 455 450, 458 425 Z" fill="#d8b27c" stroke="#aa8252" stroke-width="3" />

			<text x="400" y="475" text-anchor="middle" font-size="22" fill="#254b2c">Welcome to our garden</text>

			<g id="annotations">
				<line x1="690" y1="85" x2="620" y2="45" />
				<text x="505" y="42">circle (cx=690, cy=85, r=48)</text>

				<line x1="270" y1="245" x2="205" y2="225" />
				<text x="20" y="220">rect (x=270, y=245, width=300, height=180)</text>

				<line x1="170" y1="105" x2="220" y2="75" />
				<text x="225" y="72">ellipse (cx=170, cy=105, rx=72, ry=28)</text>

				<line x1="334" y1="285" x2="350" y2="260" />
				<text x="355" y="257">line (x1=334, y1=285) -&gt; (x2=334, y2=343)</text>

				<line x1="105" y1="390" x2="185" y2="410" />
				<text x="190" y="414">polyline (15,390 15,335 45,335)</text>

				<line x1="420" y1="105" x2="600" y2="85" />
				<text x="605" y="82">polygon (245,250 420,105 595,250)</text>

				<line x1="420" y1="425" x2="585" y2="445" />
				<text x="590" y="449">path (M 420 425 C 420 450, 350 462)</text>

				<line x1="400" y1="475" x2="265" y2="475" />
				<text x="20" y="480">text (x=400, y=475)</text>
			</g>
		</svg>
		<figcaption>Annotated scene (Step 2)</figcaption>
	</figure>

	<figure id="scene-adjusted-figure">
		<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="adjusted-title adjusted-desc">
			<title id="adjusted-title">Adjusted house and garden scene</title>
			<desc id="adjusted-desc">A higher-contrast house and garden scene with a dashed fence, curved stone footpath, mailbox, and chimney smoke.</desc>

			<!-- Adjusted contrast for the sky and grass. -->
			<rect x="0" y="0" width="800" height="350" fill="#a9d9f5" />
			<rect x="0" y="350" width="800" height="150" fill="#65ad62" />

			<!-- Sun and cloud retain the original positions at the same scale. -->
			<circle cx="690" cy="85" r="48" fill="#ffd166" stroke="#b87900" stroke-width="5" />
			<ellipse cx="170" cy="105" rx="72" ry="28" fill="#ffffff" stroke="#78909c" stroke-width="2" />
			<circle cx="125" cy="104" r="28" fill="#ffffff" />
			<circle cx="188" cy="91" r="35" fill="#ffffff" />

			<!-- Small left shift balances the tree against the repositioned house. -->
			<g transform="translate(-15, 0)">
				<rect x="92" y="245" width="34" height="125" fill="#70451f" stroke="#4d3019" stroke-width="4" />
				<circle cx="110" cy="205" r="64" fill="#287a3d" stroke="#1d5d2d" stroke-width="4" />
				<circle cx="65" cy="236" r="45" fill="#39994c" />
				<circle cx="155" cy="237" r="48" fill="#39994c" />
			</g>

			<!-- Small right shift gives the house and tree more breathing room. -->
			<g transform="translate(18, 0)">
				<rect x="270" y="245" width="300" height="180" fill="#e49a4f" stroke="#5b351d" class="adjusted-outline" />
				<polygon points="245,250 420,105 595,250" fill="#a83f35" stroke="#5b351d" stroke-width="6" />
				<rect x="485" y="145" width="42" height="82" fill="#713b32" stroke="#5b351d" stroke-width="4" />

				<rect x="382" y="320" width="76" height="105" fill="#573825" stroke="#392418" stroke-width="5" />
				<circle cx="443" cy="374" r="5" fill="#ffe08a" />
				<rect x="300" y="285" width="68" height="58" fill="#73c6e5" stroke="#234b5b" class="adjusted-outline" />
				<line x1="334" y1="285" x2="334" y2="343" stroke="#234b5b" stroke-width="3" />
				<line x1="300" y1="314" x2="368" y2="314" stroke="#234b5b" stroke-width="3" />
				<rect x="474" y="285" width="68" height="58" fill="#73c6e5" stroke="#234b5b" class="adjusted-outline" />
				<line x1="508" y1="285" x2="508" y2="343" stroke="#234b5b" stroke-width="3" />
				<line x1="474" y1="314" x2="542" y2="314" stroke="#234b5b" stroke-width="3" />
			</g>

			<!-- The fence is lighter, thinner, and dashed for visual variation. -->
			<polyline points="15,390 15,335 45,335 45,390 75,390 75,335 105,335 105,390 135,390 135,335 165,335 165,390 195,390" fill="none" stroke="#633d1d" class="adjusted-fence" />
			<line x1="0" y1="360" x2="210" y2="360" stroke="#633d1d" class="adjusted-fence" />

			<!-- A curved stone footpath leads from the door to the foreground. -->
			<path d="M 438 425 C 438 448, 470 465, 500 500 L 350 500 C 385 465, 420 448, 420 425 Z" fill="#b9b8a6" stroke="#66695d" stroke-width="4" />

			<!-- A small mailbox sits beside the new path. -->
			<rect x="520" y="385" width="42" height="28" fill="#315d86" stroke="#1f3c59" stroke-width="3" />
			<polygon points="520,385 541,369 562,385" fill="#4a7faa" stroke="#1f3c59" stroke-width="3" />
			<line x1="541" y1="413" x2="541" y2="445" stroke="#1f3c59" stroke-width="4" />

			<!-- Two soft ellipses make a subtle puff of chimney smoke. -->
			<ellipse cx="530" cy="120" rx="18" ry="12" class="smoke" />
			<ellipse cx="548" cy="92" rx="24" ry="15" class="smoke" />

			<!-- Original curved garden path and caption remain part of the copied scene. -->
			<path d="M 420 425 C 420 450, 350 462, 300 500 L 530 500 C 500 462, 455 450, 458 425 Z" fill="#d1aa72" stroke="#876338" stroke-width="3" />
			<text x="400" y="475" text-anchor="middle" font-size="22" fill="#173d20">Welcome to our garden</text>
		</svg>
		<figcaption>Adjusted scene (Step 3)</figcaption>
	</figure>
</body>
</html>
